# Continuous integration: format check, lint, build and test every workspace
# (unit, database and browser tests) on each push to main, on every pull
# request, and on manual runs.
name: CI

on:
  push:
    branches: [main]
    # Docs-only changes cannot break the build, so skip CI for them.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable Postgres for the database tests. Pulled from Google's mirror of
    # the official Docker Hub image, which avoids both Docker Hub pull rate limits
    # and the anonymous data limit of Amazon ECR Public.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: kloister
          POSTGRES_PASSWORD: kloister
          POSTGRES_DB: kloister_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kloister -d kloister_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kloister:kloister@localhost:5432/kloister_test
      # Keep the Prisma CLI from contacting its update-check service.
      CHECKPOINT_DISABLE: '1'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The Node major is pinned in .nvmrc so CI, developers and the
      # app-local runtime on the server stay on the same release line.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Build first: the API and web app consume @kloister/shared from its
      # compiled output, and type-aware lint rules need those declarations.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Verify the real ZIP outside the workspace, without a database connection.
      - name: Package and verify extracted runtime
        run: |
          npm run package:release -- 1.0.0 dist/ci-release
          npm run verify:release -- dist/ci-release

      # Apply the committed migrations exactly as install.sh/upgrade.sh will.
      - name: Apply database migrations
        run: npm run migrate:deploy -w @kloister/api

      # Fail if schema.prisma has changes with no matching migration.
      - name: Check migrations match the schema
        working-directory: apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Database tests
        run: npm run test:db -w @kloister/api

      # Browser tests (Playwright) against the real API, on a separate empty
      # database so the database tests above cannot leave data behind. The
      # Playwright config starts the API and the Angular dev server itself.
      - name: Create the browser-test database
        env:
          PGPASSWORD: kloister
        run: psql -h localhost -U kloister -d kloister_test -c 'CREATE DATABASE kloister_e2e'

      - name: Apply migrations to the browser-test database
        env:
          DATABASE_URL: postgresql://kloister:kloister@localhost:5432/kloister_e2e
        run: npm run migrate:deploy -w @kloister/api

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        env:
          DATABASE_URL: postgresql://kloister:kloister@localhost:5432/kloister_e2e
        run: npm run test:e2e -w @kloister/web

      # The HTML report holds a screenshot of every test and a trace of each
      # failure; open the run's Summary page to download it. The API's own
      # log files from the browser tests (LOG_DIR in playwright.config.ts)
      # go with it, since the API logs to files rather than to the console.
      - name: Upload the browser-test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/e2e/report/
            /tmp/kloister-e2e-server/logs/
          retention-days: 14
          if-no-files-found: ignore
